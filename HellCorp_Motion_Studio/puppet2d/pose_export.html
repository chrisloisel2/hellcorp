<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HellCorp Puppet2D Pose Export</title>
  <script type="importmap">
  {
    "imports": {
      "three": "/tools/node_modules/three/build/three.module.js",
      "three/addons/": "/tools/node_modules/three/examples/jsm/",
      "@pixiv/three-vrm": "/tools/node_modules/@pixiv/three-vrm/lib/three-vrm.module.min.js"
    }
  }
  </script>
  <style>
    html, body { margin: 0; background: #181412; color: #eee; font: 14px system-ui, sans-serif; }
    main { padding: 24px; max-width: 720px; margin: auto; }
    section { background: #241e1b; padding: 16px; border-radius: 8px; }
    label { display: block; margin: 12px 0; }
    input { width: 100%; }
    #status[data-bad="1"] { color: #ff7d7d; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Puppet2D Pose Export</h1>
      <div id="status">Starting...</div>
      <label>VRM<input id="vrmInput" type="file" accept=".vrm,model/gltf-binary" /></label>
      <label>Mixamo FBX<input id="fbxInput" type="file" accept=".fbx,application/octet-stream" /></label>
      <p>This page exports deterministic normalized 2D joint motion. It does not render or stylize animation frames.</p>
    </section>
  </main>
  <script type="module" src="./pose_export_app.js"></script>
</body>
</html>
