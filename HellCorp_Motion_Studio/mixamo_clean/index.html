<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HellCorp Mixamo Clean Retarget</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
    }
  }
  </script>
  <style>
    html, body { margin: 0; background: #181412; color: #eee; font: 14px system-ui, sans-serif; }
    header { display: flex; justify-content: space-between; padding: 12px 16px; background: #211b18; }
    main { display: grid; grid-template-columns: 300px 1fr 420px; gap: 12px; padding: 12px; }
    section { background: #241e1b; padding: 12px; border-radius: 8px; }
    label { display: block; margin: 10px 0; }
    input { width: 100%; }
    canvas { display: block; width: min(78vh, 768px); height: min(78vh, 768px); margin: auto; background: #2b2320; }
    button { margin: 4px; padding: 7px 10px; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 11px; max-height: 75vh; overflow: auto; }
    #status[data-bad="1"] { color: #ff7d7d; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <strong>HellCorp Mixamo Clean Retarget</strong>
    <span id="status">Starting...</span>
  </header>
  <main>
    <section>
      <h3>Inputs</h3>
      <label>VRM<input id="vrmInput" type="file" accept=".vrm,model/gltf-binary" /></label>
      <label>Mixamo FBX<input id="fbxInput" type="file" accept=".fbx,application/octet-stream" /></label>
      <h3>View</h3>
      <button data-view="front">Front</button>
      <button data-view="threequarter">3/4</button>
      <button data-view="side">Side</button>
      <button data-view="back">Back</button>
      <p>This page deliberately contains no MediaPipe, no procedural gait, no IK, no LoRA, no pixel filter and no toon post-process. It only validates Mixamo -> VRM retargeting.</p>
    </section>
    <section>
      <canvas id="renderCanvas" width="768" height="768"></canvas>
    </section>
    <section>
      <h3>Retarget report</h3>
      <pre id="report">Load a VRM then an FBX.</pre>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
