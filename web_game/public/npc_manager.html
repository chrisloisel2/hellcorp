<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HellCorp — Gestion des PNJ</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="npc_manager.css" />
</head>
<body>
  <div class="topbar">
    <span id="whoami"></span>
    <a href="/game.html">Night Shift</a>
    <a href="/dashboard.html">Day Shift</a>
    <a href="/messages.html">Messages</a>
    <a href="/editor.html">Éditeur de map</a>
    <a href="/story_manager.html">Trame narrative</a>
    <button id="logout">Déconnexion</button>
  </div>

  <div class="npc-manager">
    <div class="clock-panel">
      <div class="clock-display">
        <span class="clock-day">Jour <span id="clock-day">1</span></span>
        <span class="clock-hour" id="clock-hour">09:00</span>
        <span class="clock-paused-badge" id="clock-paused-badge" hidden>En pause</span>
      </div>
      <div class="clock-controls">
        <label>Heure
          <input id="clock-hour-input" type="range" min="0" max="24" step="0.25" value="9" />
        </label>
        <label>Jour
          <input id="clock-day-input" type="number" min="1" step="1" value="1" />
        </label>
        <label>Vitesse (s réelles / heure de jeu)
          <input id="clock-scale-input" type="number" min="1" step="1" value="30" />
        </label>
        <button id="clock-pause-btn" type="button">Mettre en pause</button>
        <button id="clock-apply-btn" type="button" class="save-btn">Appliquer</button>
      </div>
    </div>

    <div class="manager-body">
      <div class="character-tabs-col">
        <div class="character-tabs" id="character-tabs"></div>
        <button id="new-npc-btn" type="button">+ Nouveau PNJ</button>
      </div>

      <div class="schedule-panel">
        <div class="panel-header">
          <div class="sub-tabs">
            <button data-panel="schedule" class="sub-tab-btn active" type="button">Planning</button>
            <button data-panel="animation" class="sub-tab-btn" type="button">Animation</button>
          </div>
          <button id="delete-npc-btn" type="button" class="danger-btn">Supprimer ce PNJ</button>
        </div>

        <div id="schedule-subpanel">
          <div class="timeline" id="timeline"></div>

          <div class="schedule-list" id="schedule-list"></div>

          <div class="schedule-actions">
            <button id="add-block-btn" type="button">+ Ajouter un bloc horaire</button>
            <button id="save-schedule-btn" type="button" class="save-btn">Sauvegarder le planning</button>
          </div>
          <p id="schedule-status" class="status"></p>

          <div class="legend" id="legend"></div>
        </div>

        <div id="animation-subpanel" hidden>
          <div class="row">
            <label for="anim-action-select">Action</label>
            <select id="anim-action-select"></select>
            <span id="anim-override-badge" class="override-badge" hidden>personnalisée</span>
          </div>

          <div class="anim-preview-wrap">
            <canvas id="anim-preview-canvas" width="220" height="220"></canvas>
          </div>

          <div id="anim-sliders"></div>

          <div class="schedule-actions">
            <button id="anim-reset-btn" type="button">Réinitialiser (défaut)</button>
            <button id="anim-save-btn" type="button" class="save-btn">Sauvegarder l'animation</button>
          </div>
          <p id="animation-status" class="status"></p>
        </div>
      </div>
    </div>
  </div>

  <div id="new-npc-modal-overlay" class="modal-overlay" hidden>
    <div class="modal-box">
      <h3>Nouveau PNJ</h3>
      <div class="row">
        <label for="new-npc-key">Identifiant (unique, minuscules)</label>
        <input id="new-npc-key" type="text" placeholder="ex: seraphine" />
      </div>
      <div class="row">
        <label for="new-npc-name">Nom</label>
        <input id="new-npc-name" type="text" placeholder="ex: Séraphine" />
      </div>
      <div class="row">
        <label for="new-npc-title">Titre</label>
        <input id="new-npc-title" type="text" placeholder="ex: Directrice financière" />
      </div>
      <div class="row">
        <label for="new-npc-avatar">Avatar</label>
        <select id="new-npc-avatar"></select>
      </div>
      <div class="row">
        <label for="new-npc-color">Couleur</label>
        <input id="new-npc-color" type="color" value="#8a5cff" />
      </div>
      <p id="new-npc-status" class="status"></p>
      <div class="modal-actions">
        <div class="modal-actions-right">
          <button id="new-npc-cancel-btn" type="button">Annuler</button>
          <button id="new-npc-create-btn" type="button" class="save-btn">Créer</button>
        </div>
      </div>
    </div>
  </div>

  <div id="position-modal-overlay" class="modal-overlay" hidden>
    <div class="modal-box">
      <h3>Choisir la position — <span id="position-modal-title"></span></h3>
      <p class="hint">Clique dans la carte pour placer le PNJ à cet endroit pour ce bloc horaire. Flèches / molette pour te déplacer dans la carte.</p>
      <div class="position-canvas-wrap">
        <canvas id="position-canvas" width="760" height="480"></canvas>
      </div>
      <div class="modal-actions">
        <div class="modal-actions-right">
          <button id="position-cancel-btn" type="button">Annuler</button>
          <button id="position-save-btn" type="button" class="save-btn">Valider la position</button>
        </div>
      </div>
    </div>
  </div>

  <script src="npc_manager.js"></script>
</body>
</html>
